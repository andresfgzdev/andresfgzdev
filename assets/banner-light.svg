<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Andres Gallego — Software engineer building AI tooling for coding agents">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(22,22,29,0.09)"/></pattern>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5B47FB" stop-opacity="0.55"/><stop offset="1" stop-color="#5B47FB" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2563EB" stop-opacity="0.35"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0.35" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <clipPath id="r"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
      .rise{opacity:0;animation:rise .7s cubic-bezier(.23,1,.32,1) forwards}
      .d1{animation-delay:.07s}.d2{animation-delay:.14s}.d3{animation-delay:.21s}.d4{animation-delay:.28s}
      @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      .float{animation:float 9s ease-in-out infinite alternate}
      .float2{animation:float 11s ease-in-out infinite alternate-reverse}
      @keyframes float{from{transform:translate(0,0)}to{transform:translate(-40px,24px)}}
      .caret{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1}.float,.float2,.caret{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="320" fill="#FFFFFF"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <circle class="float" cx="980" cy="120" r="260" fill="url(#orb)"/>
    <circle class="float2" cx="1120" cy="300" r="200" fill="url(#orb2)"/>
    <rect width="1200" height="320" fill="url(#fade)"/>

    <g class="rise">
      <rect x="64" y="58" width="148" height="30" rx="15" fill="#F0EEFF"/>
      <circle cx="84" cy="73" r="4" fill="#5B47FB"/>
      <text x="98" y="78" class="m" font-size="13" fill="#5B47FB">@andresfgzdev</text>
    </g>
    <text x="62" y="152" class="t rise d1" font-size="58" font-weight="650" letter-spacing="-2.3" fill="#16161D">Andres Gallego</text>
    <text x="64" y="196" class="t rise d2" font-size="22" letter-spacing="-0.4" fill="#62626D">Software engineer · 6+ yrs · React, Next.js &amp; Node.js ·
      <tspan fill="#5B47FB" font-weight="600">AI tooling</tspan></text>

    <g class="rise d3">
      <rect x="64" y="226" width="436" height="44" rx="12" fill="#13131F"/>
      <text x="84" y="254" class="m" font-size="15" fill="#8B8B96">$</text>
      <text x="102" y="254" class="m" font-size="15" fill="#E8E8F0">building specs → code → shipped<tspan fill="#B4A7FF"> with agents</tspan></text>
      <rect class="caret" x="468" y="240" width="9" height="18" rx="1" fill="#B4A7FF"/>
    </g>

    <g transform="translate(920 64)"><g class="rise d4">
      <rect width="216" height="192" rx="18" fill="#FFFFFF" fill-opacity="0.72" stroke="rgba(22,22,29,0.09)"/>
      <text x="20" y="34" class="m" font-size="12" letter-spacing="1" fill="#62626D">NOW</text>
      <circle cx="26" cy="64" r="4" fill="#5B47FB"/><text x="40" y="69" class="t" font-size="15" fill="#16161D">Portfolio · Next.js 16</text>
      <circle cx="26" cy="98" r="4" fill="#D97706"/><text x="40" y="103" class="t" font-size="15" fill="#16161D">Skills for Claude Code</text>
      <circle cx="26" cy="132" r="4" fill="#16A34A"/><text x="40" y="137" class="t" font-size="15" fill="#16161D">Daily LeetCode</text>
      <circle cx="26" cy="166" r="4" fill="#2563EB"/><text x="40" y="171" class="t" font-size="15" fill="#16161D">3D on the web</text></g>
    </g>
  </g>
</svg>
